/directories/cashdesks:
  get:
    tags: [CashDesks]
    parameters:
      - name: showAlsoClosed
        in: query
        required: false
        schema:
          type: boolean
          default: true
    responses:
      '200':
        description: OK
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
  post:
    tags: [CashDesks]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/directories/CashDesk.yaml
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/directories/CashDesk.yaml
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
