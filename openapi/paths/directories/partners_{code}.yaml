/directories/partners/{code}:
  get:
    tags: [Partners]
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: OK
      '401':
        $ref: ../../openapi.yaml#/components/responses/Unauthorized
  put:
    tags: [Partners]
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/directories/Partner.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/directories/Partner.yaml
      '401':
        $ref: ../../openapi.yaml#/components/responses/Unauthorized
  delete:
    tags: [Partners]
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: OK
      '401':
        $ref: ../../openapi.yaml#/components/responses/Unauthorized
