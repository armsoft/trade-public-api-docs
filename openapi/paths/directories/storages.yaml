/directories/storages:
  get:
    tags: [Storages]
    parameters:
      - name: showAlsoClosed
        in: query
        required: false
        schema:
          type: boolean
          default: true
    responses:
      '200':
        description: OK
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
  post:
    tags: [Storages]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/directories/Storage.yaml
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/directories/Storage.yaml
      '401':
        $ref: ../../components/responses/Unauthorized.yaml

/directories/storages/{code}:
  get:
    tags: [Storages]
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: OK
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
  put:
    tags: [Storages]
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/directories/Storage.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/directories/Storage.yaml
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
  delete:
    tags: [Storages]
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: OK
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
