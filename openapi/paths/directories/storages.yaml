/directories/storages:
  get:
    tags: [Storages]
    responses:
      '200':
        description: OK
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/directories/Storage.yaml
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
/directories/storages/{code}:
  get:
    tags: [Storages]
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: OK
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/directories/Storage.yaml
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
      '200':
        description: OK
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
