/directories/products/{productCode}/measureunits/{unitCode}:
  get:
    tags: [Measure Units]
    summary: Get product measure unit by product and unit code
    operationId: ProductsMeasureUnits_Get
    parameters:
      - name: productCode
        in: path
        required: true
        schema:
          type: string
        description: Product code
      - name: unitCode
        in: path
        required: true
        schema:
          type: string
        description: Measure unit code
    responses:
      '200':
        description: Product measure unit fetched successfully
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/directories/ProductMeasureUnit.yaml
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
      '403':
        $ref: ../../components/responses/Forbidden.yaml
      '404':
        $ref: ../../components/responses/NotFound.yaml
      '405':
        $ref: ../../components/responses/MethodNotAllowed.yaml
      '429':
        $ref: ../../components/responses/TooManyRequests.yaml
      '500':
        $ref: ../../components/responses/InternalError.yaml
      '503':
        $ref: ../../components/responses/ServiceUnavailable.yaml
      '200':
        description: Product measure unit updated successfully
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/directories/ProductMeasureUnit.yaml
      '400':
        $ref: ../../components/responses/BadRequest.yaml
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
      '403':
        $ref: ../../components/responses/Forbidden.yaml
      '404':
        $ref: ../../components/responses/NotFound.yaml
      '405':
        $ref: ../../components/responses/MethodNotAllowed.yaml
      '409':
        $ref: ../../components/responses/Conflict.yaml
      '429':
        $ref: ../../components/responses/TooManyRequests.yaml
      '500':
        $ref: ../../components/responses/InternalError.yaml
      '503':
        $ref: ../../components/responses/ServiceUnavailable.yaml
      '200':
        description: Product measure unit deleted successfully
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
      '403':
        $ref: ../../components/responses/Forbidden.yaml
      '404':
        $ref: ../../components/responses/NotFound.yaml
      '405':
        $ref: ../../components/responses/MethodNotAllowed.yaml
      '409':
        $ref: ../../components/responses/Conflict.yaml
      '429':
        $ref: ../../components/responses/TooManyRequests.yaml
      '500':
        $ref: ../../components/responses/InternalError.yaml
      '503':
        $ref: ../../components/responses/ServiceUnavailable.yaml
