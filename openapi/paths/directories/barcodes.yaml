/directories/barcodes:
  post:
    tags: [Barcodes]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/directories/Barcode.yaml
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/directories/Barcode.yaml
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
/directories/barcodes/list:
  post:
    tags: [Barcodes]
    requestBody:
      required: true
      content:
        application/json:
