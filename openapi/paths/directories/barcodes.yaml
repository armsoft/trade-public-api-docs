            $ref: ../../components/schemas/directories/BarcodeFilters.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/directories/BarcodeApiResponse.yaml
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
/directories/barcodes/list/nextpage:
  post:
    tags: [Barcodes]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/_shared/NextPageRequest.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/directories/BarcodeApiResponse.yaml
      '401':
        $ref: ../../components/responses/Unauthorized.yaml
